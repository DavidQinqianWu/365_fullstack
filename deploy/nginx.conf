# 根据浏览器的 Accept-Language 头选语言。
# 静态站没有服务器代码,所以这一步由 nginx 做——语言协商本来就是 HTTP 的事。
map $http_accept_language $pref_lang {
  default  zh;
  ~*^de    de;
  ~*^en    en;
  ~*^zh    zh;
}

server {
  listen 80;
  charset utf-8;
  root /usr/share/nginx/html;
  # nginx 在 Traefik 后面,看不到外面是 HTTPS。发相对 Location,让浏览器自己保持 https。
  absolute_redirect off;
  index index.html;

  location = / { return 302 /$pref_lang/; }
  location / { try_files $uri $uri/ $uri.html =404; }
  location ~* \.(css|js|svg|png|jpg|woff2)$ { expires 7d; }
}
