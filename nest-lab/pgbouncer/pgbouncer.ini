;; Day 41:本地开发用的 PgBouncer 配置(PgBouncer 1.22,只给开发 / 实验用,不是生产配置)
;;
;; 手动启动(在 nest-lab 目录下执行,相对路径都以它为准;不能用 root 运行,root 下加 -u <普通用户>):
;;   pgbouncer pgbouncer/pgbouncer.ini          # 前台运行,Ctrl+C 停止
;;   pgbouncer -d pgbouncer/pgbouncer.ini       # 后台运行;停止:kill $(cat /tmp/nest-lab-pgbouncer.pid)
;; npm run day41 会自己生成一份临时配置(%include 本文件,再把日志 / pid 放进临时目录),跑完一定停掉。
;;
;; 连接:
;;   psql postgresql://nest_lab:nest_lab_dev@127.0.0.1:6432/nest_lab              # transaction 模式
;;   psql postgresql://nest_lab:nest_lab_dev@127.0.0.1:6432/nest_lab_session      # session 模式
;;   psql postgresql://nest_lab:nest_lab_dev@127.0.0.1:6432/nest_lab_statement    # statement 模式
;;   psql postgresql://nest_lab:nest_lab_dev@127.0.0.1:6432/pgbouncer             # 管理控制台:SHOW POOLS; SHOW STATS;

[databases]
;; 左边是「客户端连接时写的库名」,右边是 PgBouncer 真正去连的 PostgreSQL。
;; 三个别名指向同一个库,只是池模式不同 —— 一个 PgBouncer 进程里就能对比三种模式。
nest_lab           = host=127.0.0.1 port=5432 dbname=nest_lab
nest_lab_session   = host=127.0.0.1 port=5432 dbname=nest_lab pool_mode=session
nest_lab_statement = host=127.0.0.1 port=5432 dbname=nest_lab pool_mode=statement

;; 给 nest-lab 应用用的别名(transaction 模式):PgBouncer 不接受启动参数 options 里的 search_path,
;; 所以由 PgBouncer 在「每新建一个服务端连接」时执行一次 connect_query 设好 schema。
;; 同一个别名下的所有服务端连接 schema 都一样,换哪个连接都没关系 —— 这和「应用自己执行 SET」不同(见讲义第 5 节)。
;; 应用这边:DATABASE_URL 指向别名,DB_STARTUP_SEARCH_PATH=false
nest_lab_app       = host=127.0.0.1 port=5432 dbname=nest_lab connect_query='SET search_path = app'
nest_lab_app_test  = host=127.0.0.1 port=5432 dbname=nest_lab connect_query='SET search_path = app_test'

;; Day 41 的实验用:
;;   nest_lab_tiny:只有 2 个服务端连接,手动复现「会话级状态串到别人那里」时最容易看清(sql/day41/03-session-state.sql)
;;   nest_lab_day41:npm run day41 第 7 幕用 nest-lab 的真实代码经过 PgBouncer 跑(schema day41)
nest_lab_tiny      = host=127.0.0.1 port=5432 dbname=nest_lab pool_size=2
nest_lab_day41     = host=127.0.0.1 port=5432 dbname=nest_lab connect_query='SET search_path = day41'

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
;; 不开 Unix socket:只走 TCP,和应用的连接方式一致
unix_socket_dir =

;; ---- 认证 ----
;; 客户端 → PgBouncer:SCRAM(和本机 PostgreSQL 的 pg_hba.conf 一样)。
;; PgBouncer → PostgreSQL:用 userlist.txt 里同一个用户的密码再做一次 SCRAM。
;; userlist.txt 里放的是本地开发的占位密码 nest_lab_dev(和 .env.example 一样),所以提交进了 git;
;; 真实环境的密码不能这样放,见讲义「Docker / 生产环境」。
auth_type = scram-sha-256
auth_file = pgbouncer/userlist.txt
;; 能进管理控制台(虚拟库 pgbouncer)执行 SHOW 命令的用户
admin_users = nest_lab
stats_users = nest_lab

;; ---- 池 ----
;; transaction:一个事务结束就把服务端连接还回池里(最常用)。上面的库别名可以单独覆盖
pool_mode = transaction
;; 每个「库 + 用户」组合最多开几个到 PostgreSQL 的连接(真正进账房的伙计数)
default_pool_size = 20
;; 最多接多少个客户端连接(门口能排多少位客人)。这个数可以远大于 PostgreSQL 的 max_connections
max_client_conn = 500
;; 客户端等了这么久还没分到服务端连接 → 断开它(秒)
query_wait_timeout = 30

;; ---- 预备语句(1.21+)----
;; 0 = 不支持协议层的具名预备语句(1.22 的默认值);> 0 = PgBouncer 自己记住每个客户端准备过的语句,
;; 换到别的服务端连接时替它重新 Parse。npm run day41 第 5 幕对比开 / 关两种情况
max_prepared_statements = 0

;; ---- 启动参数 ----
;; PgBouncer 默认只认少数几个启动参数(client_encoding、DateStyle、TimeZone、standard_conforming_strings、application_name 等),
;; 其他的一律拒绝:"unsupported startup parameter"。nest-lab 的 pg-pool.ts 用 options=-c search_path=… 选 schema,
;; 能不能过 PgBouncer,见 npm run day41 第 6 幕和讲义
;ignore_startup_parameters = options

;; ---- 日志 / 进程 ----
logfile = /tmp/nest-lab-pgbouncer.log
pidfile = /tmp/nest-lab-pgbouncer.pid
log_connections = 0
log_disconnections = 0
